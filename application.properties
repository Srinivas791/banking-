# =============================================================================
# Simple Banking Management System - Master Configuration
# Course: B.Tech Software Engineering Academic Project
# =============================================================================

spring.application.name=simple-banking-system
server.port=8080

# Active Profile:
# Use 'mysql' when local MySQL server (port 3306) is running.
# Use 'h2' for instant zero-configuration in-memory execution (Ideal for lab demos & viva).
spring.profiles.active=h2

# Server context & compression
server.servlet.context-path=/
server.compression.enabled=true
server.compression.mime-types=text/html,text/xml,text/plain,text/css,text/javascript,application/javascript,application/json

# File Upload limits (for KYC documents if needed)
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=10MB

# JSON date formatting
spring.jackson.date-format=yyyy-MM-dd'T'HH:mm:ss
spring.jackson.time-zone=UTC

# Logging Configuration
logging.level.root=INFO
logging.level.com.bank=DEBUG
logging.level.org.springframework.security=INFO
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
